# This manifest extends disagg.yaml with load-based scaling. Each replica is a
# complete four-GPU DP=1 engine; Planner changes only component replica counts.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: megatron-disagg-planner
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/megatron-runtime:my-tag
          command: [python3]
          args: [-m, dynamo.frontend, --router-mode, kv]
    Planner:
      componentType: planner
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:my-tag
          command: [python3, -m, dynamo.planner]
          args:
            - --config
            - '{"environment":"kubernetes","backend":"megatron","mode":"disagg","optimization_target":"load","pre_deployment_sweeping_mode":"none","prefill_engine_num_gpu":4,"decode_engine_num_gpu":4,"prefill_scale_up_queue_tokens":10000,"prefill_scale_down_queue_tokens":2000,"decode_scale_up_kv_rate":80,"decode_scale_down_kv_rate":40,"min_endpoint":1}'
    MegatronDecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      resources:
        limits:
          gpu: "4"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/megatron-runtime:my-tag
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: [python3, -m, megatron.inference.integrations.dynamo]
          args:
            - --role
            - decode
            - --model
            - Qwen/Qwen3-8B
            - --nproc-per-node
            - "4"
            - --coordinator-host
            - $(POD_IP)
            - --kv-transfer-listen-addr
            - $(POD_IP):7000
            - --
            - --load
            - /models/qwen3-8b-megatron
            - --tensor-model-parallel-size
            - "4"
            - --tokenizer-type
            - HuggingFaceTokenizer
            - --tokenizer-model
            - Qwen/Qwen3-8B
            - --inference-dynamic-batching
            - --inference-dynamic-batching-prefix-caching
    MegatronPrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      resources:
        limits:
          gpu: "4"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/megatron-runtime:my-tag
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: [python3, -m, megatron.inference.integrations.dynamo]
          args:
            - --role
            - prefill
            - --model
            - Qwen/Qwen3-8B
            - --nproc-per-node
            - "4"
            - --coordinator-host
            - $(POD_IP)
            - --kv-transfer-listen-addr
            - $(POD_IP):7000
            - --
            - --load
            - /models/qwen3-8b-megatron
            - --tensor-model-parallel-size
            - "4"
            - --tokenizer-type
            - HuggingFaceTokenizer
            - --tokenizer-model
            - Qwen/Qwen3-8B
            - --inference-dynamic-batching
            - --inference-dynamic-batching-prefix-caching
